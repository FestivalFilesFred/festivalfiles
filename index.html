<!DOCTYPE html>
<html>
<head>
    <title>FestivalFiles</title>
    <style>
        body {
            background-color: #ffccff;
            font-family: Comic Sans MS, cursive;
            color: #0000ff;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #gif-intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #gif-intro img {
            max-width: 100%;
            max-height: 100%;
            cursor: pointer;
        }
        .content {
            display: none;
            padding-top: 50px;
        }
        h1 {
            color: #ff00ff;
            text-shadow: 2px 2px 0px #00ffff;
            font-size: 48px;
        }
        .download-section {
            margin: 20px auto;
            width: 80%;
            background-color: #ffff00;
            padding: 20px;
            border: 3px dotted #00ff00;
        }
        a {
            color: #ff0000;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="gif-intro">
        <img src="drivingtest.gif" alt="Intro-GIF" onclick="startWebsite()">
    </div>
    <div class="content" id="main-content">
        <h1>FestivalFiles</h1>
        <p>Klicke auf die Datei, um es herunterzuladen:</p>
        <div class="download-section">
            <p><a href="raetsel1.pdf" download>Rätsel 1: Das Geheimnis der pinken Pferde</a></p>
            <p><a href="raetsel2.pdf" download>Rätsel 2: Der magische Hufeisen</a></p>
            <p><a href="raetsel3.pdf" download>Rätsel 3: Das große Pferderennen</a></p>
        </div>
        <img src="https://media.giphy.com/media/3o7TKSQ5rNQXuQjJ4E/giphy.gif" alt="Pferde-GIF" width="200">
    </div>
    <script>
        function startWebsite() {
            document.getElementById('gif-intro').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }
    </script>
</body>
</html>
